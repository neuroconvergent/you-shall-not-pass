[package]
name = "you-shall-not-pass"
description = "Secure password generation with quantum bruteforce protection."
version = "0.1.0"
edition = "2024"
authors = ["Sundar Gurumurthy <sundar@sundar.guru>"]
readme = "README.md"
repository = "https://github.com/neuroconvergent/you-shall-not-pass.git"
license = "BSD-3-Clause-No-Military-License"
exclude = ["AGENTS.md", "addlicense.sh"]
keywords = [
  "password",
  "passphrase",
  "security",
  "entropy",
  "cryptography",
]
categories = [
  "cryptography",
  "security",
  "command-line-utilities",
  "gui"
]
publish = false

[dependencies]
clap = "4.5.53"
gtk4 = "0.10.3"
nix = "0.30.1"
rand = "0.9.2"
serde = "1.0.228"
thiserror = "2.0.17"
toml = "0.9.8"
unicode-segmentation = "1.12.0"
zeroize = "1.8.2"

[lints.rust]
unsafe_code = "forbid"
